[package]
name = "kobup-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[lib]
name = "kobup_service"
path = "src/lib.rs"

[[bin]]
name = "kobup-service"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "macros"] }
uuid = { version = "1.25.0", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
rand = "0.10.2"
argon2 = "0.5.3"
password-hash = { version = "0.5.0", features = ["getrandom"] }
sha2 = "0.11.0"
hex = "0.4.3"
thiserror = "2.0.20"
tower-http = { version = "0.7.0", features = ["cors"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
axmldecoder = "0.5.0"
tokio-util = { version = "0.7.19", features = ["io"] }
bytes = "1.12.1"
zip = "8.6.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
regex = "1.13.1"
dashmap = "6.2.1"

[dev-dependencies]
tempfile = "3.27.0"
zip = "8.6.0"

[[test]]
name = "integration"
path = "tests/integration.rs"
