[package]
name = "kobup-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[[bin]]
name = "kobup"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
indicatif = "0.18.6"
dialoguer = "0.12.0"
dirs = "6.0.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
glob = "0.3.4"

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
