server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Appends to X-Forwarded-For rather than overwriting it, so the API
        # can still see the real client IP for login rate limiting even
        # behind an outer reverse proxy. If you add one in front of this
        # (Nginx Proxy Manager, Caddy, ...), set KOBUP_TRUSTED_PROXY_HOPS=2.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
