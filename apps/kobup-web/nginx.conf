# NPM terminates TLS, so $scheme is always http here; the API decides Secure cookies from this.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $sent_http_content_type $html_cache_control {
    ~^text/html "no-cache";
}

server {
    listen 80;
    http2 on;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json application/wasm image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Appends to X-Forwarded-For rather than overwriting it, so the API
        # can still see the real client IP for login rate limiting even
        # behind an outer reverse proxy. If you add one in front of this
        # (Nginx Proxy Manager, Caddy, ...), set KOBUP_TRUSTED_PROXY_HOPS=2.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control $html_cache_control;
        try_files $uri $uri/ /index.html;
    }
}
