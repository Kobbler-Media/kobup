// Kobup publish helper — apply from any Android module's build.gradle.kts:
//   apply(from = "/path/to/kobup/gradle/publish-to-kobup.gradle")
//
// Requires:
//   - .kobup.json in the project root (server, projectSlug, projectName, packageName, channel)
//   - version.properties in the project root (versionCode, versionName)
//   - KOBUP_TOKEN env var or in .env (via co.uzzu.dotenv.gradle plugin)
//
// Usage: ./gradlew :app:publishToKobup

// Capture all Gradle model refs at configuration time (configuration cache compatible)
def capturedRootDir = rootDir.absolutePath
def capturedModulePath = project.path
def capturedBuildDir = project.layout.buildDirectory.get().asFile.absolutePath
def capturedPropsFile = file("${rootDir}/version.properties").absolutePath
def capturedConfigFile = file("${rootDir}/.kobup.json").absolutePath
def capturedGradlew = file("${rootDir}/gradlew").absolutePath

// Try to read token at configuration time from dotenv plugin
def capturedToken = null
try { capturedToken = env.fetchOrNull("KOBUP_TOKEN") } catch (ignored) {}

tasks.register("publishToKobup") {
    doLast {
        def rootDirFile = new File(capturedRootDir)

        def execCmd = { String... cmd ->
            def p = new ProcessBuilder(cmd).directory(rootDirFile).redirectErrorStream(true).start()
            def out = p.inputStream.text.trim()
            p.waitFor()
            return out
        }

        // Block publish if uncommitted .kt changes
        def dirtyKt = execCmd("git", "status", "--porcelain", "--", "*.kt", "**/*.kt")
        if (dirtyKt) {
            throw new GradleException("Uncommitted .kt changes — commit or stash before publishing:\n${dirtyKt}")
        }

        def token = capturedToken ?: System.getenv("KOBUP_TOKEN")
        if (!token) throw new GradleException("KOBUP_TOKEN not set. Add it to .env or export it.")

        def gitHash = execCmd("git", "rev-parse", "--short=7", "HEAD")

        // Bump version
        def propsFile = new File(capturedPropsFile)
        if (!propsFile.exists()) throw new GradleException("Missing version.properties in project root")
        def lines = propsFile.readLines().collect { it }
        def codeIdx = lines.findIndexOf { it.startsWith("versionCode=") }
        def nameIdx = lines.findIndexOf { it.startsWith("versionName=") }
        def oldCode = lines[codeIdx].split("=")[1].trim() as int
        def oldName = lines[nameIdx].split("=")[1].trim()
        def newCode = oldCode + 1
        def baseName = oldName.split("\\+")[0]
        def parts = baseName.split("\\.").collect { it }
        if (parts.size() == 3) parts[2] = ((parts[2] as int) + 1).toString()
        def newName = "${parts.join('.')}+${gitHash}"
        lines[codeIdx] = "versionCode=${newCode}"
        lines[nameIdx] = "versionName=${newName}"
        propsFile.text = lines.join("\n") + "\n"
        logger.lifecycle("Bumped version: ${oldName} (${oldCode}) → ${newName} (${newCode})")

        // Build release APK
        logger.lifecycle("Building release APK...")
        def buildProc = new ProcessBuilder(capturedGradlew, "${capturedModulePath}:assembleRelease")
            .directory(rootDirFile).redirectErrorStream(true).start()
        def buildOutput = buildProc.inputStream.text
        if (buildProc.waitFor() != 0) {
            lines[codeIdx] = "versionCode=${oldCode}"
            lines[nameIdx] = "versionName=${oldName}"
            propsFile.text = lines.join("\n") + "\n"
            throw new GradleException("assembleRelease failed:\n${buildOutput}")
        }

        // Read .kobup.json
        def configFile = new File(capturedConfigFile)
        if (!configFile.exists()) throw new GradleException("Missing .kobup.json in project root")
        def config = new groovy.json.JsonSlurper().parseText(configFile.text)
        def server = config.server
        def slug = config.projectSlug
        def projectName = config.projectName ?: slug
        def packageName = config.packageName ?: ""
        def channel = config.channel ?: "stable"

        // Ensure project exists (idempotent)
        logger.lifecycle("Ensuring project '${slug}' exists on ${server}...")
        new ProcessBuilder("curl", "-s", "-X", "POST",
            "${server}/api/v1/admin/projects",
            "-H", "Authorization: Bearer ${token}",
            "-H", "Content-Type: application/json",
            "-d", """{"slug":"${slug}","name":"${projectName}","packageName":"${packageName}"}""")
            .redirectErrorStream(true).start().waitFor()

        // Find APK
        def apkDir = new File(capturedBuildDir, "outputs/apk/release")
        def apk = apkDir.listFiles()?.find { it.name.endsWith(".apk") }
        if (!apk) throw new GradleException("No release APK found in ${apkDir.absolutePath}")

        logger.lifecycle("Publishing ${apk.name} (v${newName} code ${newCode}) to ${server}")

        // Upload
        def proc = new ProcessBuilder("curl", "-s", "-f", "-X", "POST",
            "${server}/api/v1/ci/projects/${slug}/release",
            "-H", "Authorization: Bearer ${token}",
            "-F", "apk=@${apk.absolutePath}",
            "-F", "channel=${channel}",
            "-F", "publish=true")
            .redirectErrorStream(true).start()
        def output = proc.inputStream.text
        if (proc.waitFor() != 0) {
            lines[codeIdx] = "versionCode=${oldCode}"
            lines[nameIdx] = "versionName=${oldName}"
            propsFile.text = lines.join("\n") + "\n"
            throw new GradleException("Kobup publish failed:\n${output}")
        }
        logger.lifecycle("Published successfully:\n${output}")

        // Push refresh
        new ProcessBuilder("curl", "-s", "-X", "POST",
            "${server}/api/v1/ci/projects/${slug}/push-refresh",
            "-H", "Authorization: Bearer ${token}")
            .start().waitFor()
        logger.lifecycle("Push refresh sent to devices.")
    }
}
